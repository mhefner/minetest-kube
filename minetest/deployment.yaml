apiVersion: apps/v1
kind: Deployment
metadata:
  name: minetest
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minetest
  template:
    metadata:
      labels:
        app: minetest
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: minetest
          image: mhefner1983/minetest_kube:arm64
          imagePullPolicy: Always
          args: ["/usr/games/minetestserver", "--world", "/data/world"]
          ports:
            - containerPort: 30000
              protocol: UDP
          volumeMounts:
            - name: world-storage
              mountPath: /data/world
      volumes:
        - name: world-storage
          persistentVolumeClaim:
            claimName: minetest-pvc
