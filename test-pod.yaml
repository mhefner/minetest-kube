apiVersion: v1
kind: Pod
metadata:
  name: test-minetest-volume
spec:
  containers:
  - name: test
    image: busybox
    command: ["sh", "-c", "ls -la /data && sleep 3600"]
    volumeMounts:
    - name: world-storage
      mountPath: /data
  volumes:
  - name: world-storage
    persistentVolumeClaim:
      claimName: minetest-pvc
  nodeSelector:
    kubernetes.io/arch: arm64
